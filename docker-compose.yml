services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Source is bind-mounted so local edits hot-reload in the container.
      - .:/app
      # node_modules and .next live in container volumes — npm install and
      # all build output never touch the host drive.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - WATCHPACK_POLLING=true

volumes:
  node_modules:
  next_cache:
